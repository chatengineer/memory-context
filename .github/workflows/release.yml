name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify metadata
        run: npm run verify:metadata

      - name: Build
        run: npm run build

      - name: Run test suite
        run: npm test

      - name: Prepare release bundle
        run: |
          mkdir -p release/memory-context
          cp -R dist src package.json package-lock.json openclaw.plugin.json README.md LICENSE index.ts release/memory-context/
          cd release
          tar -czf memory-context-${{ github.ref_name || 'manual' }}.tar.gz memory-context

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/memory-context-*.tar.gz
